name: build-apk
on: [push, workflow_dispatch]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: salon-near-alert-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK as release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create apk-${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --title "APK ${{ github.run_number }}" --notes "Debug APK" --target ${{ github.sha }}
